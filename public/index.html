<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NIROB'S AI</title>
<style>
  :root{--bg:#FAF8F4;--ink:#1C2320;--sub:#6B7570;--accent:#2E6E62;--bubble-ai:#EFECE4;--border:#E2DDD1}
  @media (prefers-color-scheme: dark){
    :root{--bg:#14181A;--ink:#EDEAE2;--sub:#93998F;--accent:#5FB39F;--bubble-ai:#1F2523;--border:#2A2F2C}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font-family:'Noto Sans Bengali',system-ui,sans-serif;display:flex;flex-direction:column;height:100%}
  header{padding:16px 20px;border-bottom:1px solid var(--border);font-family:Georgia,serif}
  header h1{font-size:1.25rem;margin:0}
  #chat{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
  .msg{max-width:78%;padding:11px 15px;border-radius:16px;line-height:1.55;white-space:pre-wrap}
  .user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
  .ai{align-self:flex-start;background:var(--bubble-ai);border-bottom-left-radius:4px}
  form{display:flex;gap:10px;padding:14px 16px;border-top:1px solid var(--border)}
  textarea{flex:1;resize:none;border:1px solid var(--border);border-radius:14px;padding:11px 14px;background:transparent;color:var(--ink);font-family:inherit}
  button{background:var(--accent);color:#fff;border:none;border-radius:14px;padding:0 20px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5}
</style>
</head>
<body>
<header><h1>NIROB'S AI</h1></header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="এখানে লিখুন..."></textarea>
  <button id="send">পাঠান</button>
</form>
<script>
let history = [];
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');

function addBubble(role, text){
  const d = document.createElement('div');
  d.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
  d.textContent = text;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addBubble('user', text);
  history.push({ role: 'user', content: text });
  sendBtn.disabled = true;
  const bubble = addBubble('ai', 'লিখছে...');
  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history })
    });
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    bubble.textContent = data.text;
    history.push({ role: 'assistant', content: data.text });
  } catch (err) {
    bubble.textContent = 'দুঃখিত, সমস্যা হয়েছে: ' + err.message;
  }
  sendBtn.disabled = false;
});
</script>
</body>
</html>
